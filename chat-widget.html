<!-- RELÓCTOUR: чат на сайте. Вставить перед закрывающим </body> -->
<style>
  :root{
    --rt-gold:#C9A227;
    --rt-gold-soft:#E3C766;
    --rt-emerald:#0E3B32;
    --rt-emerald-deep:#082421;
    --rt-cream:#F3EAD8;
  }
  .rt-launch{
    position:fixed; right:20px; bottom:20px; z-index:9998;
    display:flex; align-items:center; gap:10px;
    padding:14px 22px; border:1px solid var(--rt-gold);
    background:var(--rt-emerald-deep); color:var(--rt-cream);
    font:500 15px/1 inherit; letter-spacing:.04em;
    border-radius:2px; cursor:pointer;
    box-shadow:0 8px 28px rgba(0,0,0,.35);
  }
  .rt-launch:hover{ background:var(--rt-emerald); border-color:var(--rt-gold-soft); }
  .rt-launch:focus-visible{ outline:2px solid var(--rt-gold-soft); outline-offset:3px; }
  .rt-launch[hidden]{ display:none; }

  .rt-panel{
    position:fixed; right:20px; bottom:20px; z-index:9999;
    width:380px; max-width:calc(100vw - 32px); height:560px; max-height:calc(100vh - 40px);
    display:none; flex-direction:column;
    background:var(--rt-emerald-deep); color:var(--rt-cream);
    border:1px solid var(--rt-gold); border-radius:2px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .rt-panel.rt-open{ display:flex; }

  .rt-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px; border-bottom:1px solid rgba(201,162,39,.35);
  }
  .rt-title{ font-size:13px; letter-spacing:.18em; text-transform:uppercase; color:var(--rt-gold-soft); }
  .rt-close{
    background:none; border:none; color:var(--rt-cream);
    font-size:22px; line-height:1; cursor:pointer; padding:4px 8px;
  }
  .rt-close:focus-visible{ outline:2px solid var(--rt-gold-soft); outline-offset:2px; }

  .rt-log{ flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; }
  .rt-msg{ max-width:88%; padding:11px 14px; border-radius:2px; font-size:15px; line-height:1.5; white-space:pre-wrap; }
  .rt-msg.rt-bot{ background:rgba(243,234,216,.07); border-left:2px solid var(--rt-gold); align-self:flex-start; }
  .rt-msg.rt-me{ background:var(--rt-gold); color:#1a1509; align-self:flex-end; }
  .rt-msg.rt-err{ background:rgba(180,60,50,.18); border-left:2px solid #b43c32; align-self:flex-start; }

  .rt-foot{ border-top:1px solid rgba(201,162,39,.35); padding:12px; display:flex; gap:8px; }
  .rt-input{
    flex:1; resize:none; min-height:44px; max-height:110px;
    background:rgba(243,234,216,.06); border:1px solid rgba(201,162,39,.4);
    color:var(--rt-cream); padding:12px; font:inherit; font-size:15px; border-radius:2px;
  }
  .rt-input:focus{ outline:none; border-color:var(--rt-gold); }
  .rt-send{
    background:var(--rt-gold); border:none; color:#1a1509;
    padding:0 18px; font:600 15px/1 inherit; cursor:pointer; border-radius:2px;
  }
  .rt-send:disabled{ opacity:.45; cursor:default; }
  .rt-send:focus-visible{ outline:2px solid var(--rt-cream); outline-offset:2px; }

  @media (max-width:480px){
    .rt-panel{ right:0; bottom:0; width:100vw; height:100dvh; max-height:none; border:none; }
    .rt-launch{ right:16px; bottom:16px; padding:13px 18px; }
  }
</style>

<button class="rt-launch" id="rtLaunch" type="button">Задать вопрос</button>

<div class="rt-panel" id="rtPanel" role="dialog" aria-modal="false" aria-label="Чат с консультантом RELÓCTOUR">
  <div class="rt-head">
    <span class="rt-title">RELÓCTOUR</span>
    <button class="rt-close" id="rtClose" type="button" aria-label="Закрыть чат">×</button>
  </div>
  <div class="rt-log" id="rtLog" aria-live="polite"></div>
  <div class="rt-foot">
    <textarea class="rt-input" id="rtInput" rows="1" placeholder="Спросите про страну, цены или сроки" maxlength="2000"></textarea>
    <button class="rt-send" id="rtSend" type="button">→</button>
  </div>
</div>

<script>
(function(){
  var panel  = document.getElementById('rtPanel');
  var launch = document.getElementById('rtLaunch');
  var closeB = document.getElementById('rtClose');
  var log    = document.getElementById('rtLog');
  var input  = document.getElementById('rtInput');
  var send   = document.getElementById('rtSend');

  var history = [];
  var busy = false;
  var greeted = false;

  var GREETING = 'Здравствуйте. Я помогу разобраться, подходит ли вам страна — честно, без уговоров.\n\nСейчас работаем по Испании, Таиланду, Панаме и Франции. С чем помочь?';

  function bubble(text, cls){
    var el = document.createElement('div');
    el.className = 'rt-msg ' + cls;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  function open(){
    panel.classList.add('rt-open');
    launch.hidden = true;
    if (!greeted){ bubble(GREETING, 'rt-bot'); greeted = true; }
    input.focus();
  }
  function close(){
    panel.classList.remove('rt-open');
    launch.hidden = false;
    launch.focus();
  }

  launch.addEventListener('click', open);
  closeB.addEventListener('click', close);
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && panel.classList.contains('rt-open')) close();
  });

  // Другие элементы страницы тоже могут открывать чат: <button data-rt-open>...</button>
  document.querySelectorAll('[data-rt-open]').forEach(function(el){
    el.addEventListener('click', function(e){ e.preventDefault(); open(); });
  });

  input.addEventListener('input', function(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 110) + 'px';
  });
  input.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); submit(); }
  });
  send.addEventListener('click', submit);

  function submit(){
    var text = input.value.trim();
    if (!text || busy) return;

    bubble(text, 'rt-me');
    history.push({ role:'user', content:text });
    input.value = '';
    input.style.height = 'auto';

    busy = true;
    send.disabled = true;
    var typing = bubble('…', 'rt-bot');

    fetch('/.netlify/functions/chat', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ messages: history })
    })
    .then(function(r){ return r.json().then(function(d){ return { ok:r.ok, data:d }; }); })
    .then(function(res){
      typing.remove();
      if (!res.ok || !res.data.reply){
        bubble(res.data.error || 'Не получилось ответить. Напишите нам в Telegram: @Reloctour_bot', 'rt-err');
        history.pop();
        return;
      }
      bubble(res.data.reply, 'rt-bot');
      history.push({ role:'assistant', content:res.data.reply });
    })
    .catch(function(){
      typing.remove();
      bubble('Нет связи с сервером. Напишите нам в Telegram: @Reloctour_bot', 'rt-err');
      history.pop();
    })
    .then(function(){
      busy = false;
      send.disabled = false;
      input.focus();
    });
  }
})();
</script>
